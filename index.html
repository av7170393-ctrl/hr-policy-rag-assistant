<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexora People Desk</title>
<style>
:root{--bg:#fff7f2;--card:#fff;--text:#2a1020;--muted:#7c5a6b;--accent:#be185d;--ac2:#f97316;--bd:#f5dfd6;--soft:#ffe8ef;--mark:#fde68a;--on:#fff;--ok:#059669;--err:#dc2626;--sh:0 6px 20px rgba(120,30,70,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12060f;--card:#1e0d1a;--text:#fbe9f0;--muted:#c79bb0;--accent:#fb7185;--ac2:#fbbf24;--bd:#3d1f33;--soft:#2d1426;--mark:#9d174d;--on:#1a0612;--ok:#34d399;--err:#f87171;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12060f;--card:#1e0d1a;--text:#fbe9f0;--muted:#c79bb0;--accent:#fb7185;--ac2:#fbbf24;--bd:#3d1f33;--soft:#2d1426;--mark:#9d174d;--on:#1a0612;--ok:#34d399;--err:#f87171;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:18px 14px;background:linear-gradient(170deg,#4a044e,#be185d 55%,#f97316);color:#fff;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center}.lg{font-size:24px;background:rgba(255,255,255,.18);border-radius:12px;padding:6px 8px}.brand small{display:block;opacity:.75;font-size:12px}
#tabs{display:flex;flex-direction:column;gap:4px}
aside .tab{background:transparent;border:0;color:#fff;text-align:left;border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;cursor:pointer;opacity:.88}
aside .tab:hover{background:rgba(255,255,255,.14)}aside .tab.on{background:#fff;color:#9d174d;opacity:1;font-weight:700}
.tip{margin-top:auto;font-size:12px;opacity:.8;line-height:1.4}
.mw{min-width:0;padding:0 24px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:22px 0 8px;max-width:820px}
.kick{color:var(--accent);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
h1{font-size:28px;margin:2px 0;line-height:1.15}h2{font-size:20px;margin:18px 0 6px}
main{max-width:820px;padding-bottom:30px}
.who{font-size:12px;color:var(--muted);text-align:right}
select,input,textarea{background:var(--card);color:var(--text);border:1px solid var(--bd);border-radius:12px;padding:10px;font:inherit;max-width:100%}
.pill,.btn,.sm{border:1px solid var(--bd);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;flex:none;box-shadow:var(--sh)}
.btn{background:linear-gradient(135deg,var(--accent),var(--ac2));color:var(--on);border:0;font-weight:700}
.pill:hover,.sm:hover{border-color:var(--accent)}.sm{padding:4px 10px;font-size:13px;box-shadow:none}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px}
.hero{background:linear-gradient(135deg,var(--accent),var(--ac2));color:var(--on);border-radius:20px;padding:18px;margin-bottom:12px}.hero b{display:block;font-size:20px}.hero span{opacity:.9}
.box,.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:4px 16px;margin:8px 0;box-shadow:var(--sh)}.card{padding:14px 16px}
.row{display:flex;gap:10px;margin:14px 0;align-items:flex-start}.row.u{flex-direction:row-reverse}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--ac2));color:var(--on)}.u .av{background:var(--soft);color:var(--text)}
.msg{white-space:pre-wrap;word-wrap:break-word;max-width:calc(100% - 46px)}
.u .msg{background:linear-gradient(135deg,var(--accent),var(--ac2));color:var(--on);padding:9px 13px;border-radius:16px 16px 4px 16px}
.badge,.note{font-size:12px;color:var(--muted)}.note{font-size:13px}
details{font-size:14px;margin-top:6px}summary{cursor:pointer;color:var(--accent);font-weight:600}
.src{border-left:3px solid var(--accent);padding:2px 10px;margin:6px 0;color:var(--muted)}mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 3px}
.acts{display:flex;gap:6px;margin-top:6px}
.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 12px;display:flex;gap:6px}.bar input{flex:1;min-width:0}
.m{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:8px 0}.m div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh)}.m b{display:block;font-size:24px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:7px 6px;text-align:left;vertical-align:top}
.sw{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600;margin:10px 0;user-select:none}.sw input{position:absolute;opacity:0;pointer-events:none}
.trk{width:48px;height:28px;border-radius:999px;background:var(--soft);border:1px solid var(--bd);position:relative;flex:none}.trk::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.sw input:checked+.trk{background:var(--accent);border-color:var(--accent)}.sw input:checked+.trk::after{left:23px;background:var(--on)}
.doc{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}.doc div{flex:1}.doc small{color:var(--muted);display:block}
.err{color:var(--err)}.ok{color:var(--ok)}
footer{color:var(--muted);font-size:12px;padding:14px 0 26px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes sweep{to{transform:translateX(100%)}}
@keyframes blink{50%{opacity:0}}
@keyframes aurora{to{transform:translate(4%,3%) rotate(8deg) scale(1.12)}}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(30px);background:radial-gradient(circle at 20% 20%,rgba(190,24,93,.28),transparent 40%),radial-gradient(circle at 80% 30%,rgba(249,115,22,.24),transparent 40%),radial-gradient(circle at 50% 90%,rgba(168,85,247,.2),transparent 45%);animation:aurora 16s ease-in-out infinite alternate}
#view>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
#view>:nth-child(2){animation-delay:.08s}#view>:nth-child(3){animation-delay:.16s}#view>:nth-child(4){animation-delay:.24s}#view>:nth-child(n+5){animation-delay:.32s}
#view>.hero{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards,shift 9s ease infinite}
.hero{position:relative;overflow:hidden;background-size:220% 220%}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 4.5s ease-in-out infinite}
.hero b{min-height:1.4em}.hero b.ty::after{content:"▍";margin-left:2px;animation:blink 1s steps(1) infinite}
.fl{position:absolute;font-style:normal;font-size:26px;opacity:.85;animation:float 3.2s ease-in-out infinite}.fl.a{right:18px;top:10px}.fl.b{right:64px;bottom:8px;font-size:20px;animation-delay:.8s}.fl.c{right:110px;top:18px;font-size:18px;animation-delay:1.6s}
.lg{animation:float 3.5s ease-in-out infinite}
.pills .pill{animation:pop .5s cubic-bezier(.2,.9,.3,1.25) backwards}.pills .pill:nth-child(2){animation-delay:.06s}.pills .pill:nth-child(3){animation-delay:.12s}.pills .pill:nth-child(4){animation-delay:.18s}.pills .pill:nth-child(5){animation-delay:.24s}.pills .pill:nth-child(6){animation-delay:.3s}.pills .pill:nth-child(7){animation-delay:.36s}
.box:not(.quiet) .row:nth-last-child(-n+2){animation:pop .45s cubic-bezier(.2,.9,.3,1.25) backwards}
.pill,.sm,.card,.btn,.m div,aside .tab{transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.pill:hover,.card:hover,.m div:hover{transform:translateY(-3px)}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(190,24,93,.35)}.btn:active,.pill:active,.sm:active{transform:scale(.95)}aside .tab:hover{transform:translateX(4px)}
.dots{display:inline-flex;gap:4px;margin-left:4px;vertical-align:middle}.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.cf{position:fixed;top:-12px;width:8px;height:12px;border-radius:2px;z-index:99;pointer-events:none;animation:fall 1.5s ease-in forwards}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:760px){.app{display:block}aside{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0}.brand,.tip{display:none}#tabs{flex-direction:row;overflow-x:auto;width:100%;scrollbar-width:none}aside .tab{flex:none;padding:9px 12px;font-size:13px}.mw{padding:0 14px 96px}.bar{bottom:calc(60px + env(safe-area-inset-bottom,0px))}h1{font-size:24px}}
</style></head><body>
<div class="app"><aside><div class="brand"><span class="lg">💼</span><div><b>People Desk</b><small>Nexora Technologies</small></div></div><nav id="tabs"></nav><div class="tip">Ask in English, Hindi or Hinglish. Switch the demo login to see Manager and HR views.</div></aside>

 1}, {"d": "Code of Conduct", "h": "Confidentiality", "t": "Employees must not share confidential company, client or employee information with outsiders, during or after employment. Violation can lead to termination and legal action.", "l": 1}, {"d": "Code of Conduct", "h": "Conflict of Interest", "t": "Employees must declare any side business, freelance work or investments that may conflict with their role. Working for a competitor while employed at Nexora is not allowed.", "l": 1}, {"d": "Code of Conduct", "h": "Gifts", "t": "Gifts from clients or vendors worth more than ₹2,000 must be declared to HR and may need to be returned.", "l": 1}, {"d": "Code of Conduct", "h": "Disciplinary Process", "t": "Violations lead to a verbal warning, written warning, suspension or termination depending on severity. Employees get a chance to present their side before any action is taken.", "l": 1}, {"d": "Leave Policy", "h": "Casual Leave", "t": "Every employee gets 12 casual leaves per calendar year. Casual leave can be taken in half-day or full-day units. It cannot be carried forward to the next year. A maximum of 3 casual leaves can be taken consecutively.", "l": 1}, {"d": "Leave Policy", "h": "Sick Leave", "t": "Employees get 10 sick leaves per year. If sick leave exceeds 2 consecutive days, a medical certificate from a registered doctor must be submitted to HR within 3 days of returning to work.", "l": 1}, {"d": "Leave Policy", "h": "Earned Leave (Privilege Leave)", "t": "Earned leave accrues at 1.5 days per month (18 days per year). Unused earned leave can be carried forward up to a maximum balance of 30 days. Earned leave must be applied for at least 7 days in advance, except in emergencies. Employees on probation can take earned leave only after confirmation.", "l": 1}, {"d": "Leave Policy", "h": "Maternity and Paternity Leave", "t": "Female employees are entitled to 26 weeks of paid maternity leave. Male employees are entitled to 10 days of paid paternity leave, to be taken within 3 months of the child's birth.", "l": 1}, {"d": "Leave Policy", "h": "Public Holidays", "t": "The company provides 12 public holidays and 2 optional holidays per year. The holiday list is published every January on the HR portal.", "l": 1}, {"d": "Leave Policy", "h": "Applying for Leave", "t": "All leave must be applied through the HR portal and approved by the reporting manager. Unapproved absence of more than 3 consecutive days may be treated as absconding and can lead to disciplinary action. Leave without pay (LWP) is deducted from monthly salary on a per-day basis.", "l": 1}, {"d": "Manager Guidelines", "h": "Leave Approval", "t": "Managers must approve or reject leave requests within 2 working days. A rejected request must include a written reason shared with the employee.", "l": 2}, {"d": "Manager Guidelines", "h": "Expense Approval Limits", "t": "Managers can approve expense claims up to ₹25,000 per claim. Claims above this limit need approval from the department head.", "l": 2}, {"d": "Manager Guidelines", "h": "Performance Ratings", "t": "Performance is rated on a 5-point scale. A maximum of 20 percent of a team can receive the top rating of 5.", "l": 2}, {"d": "Manager Guidelines", "h": "Disciplinary Action", "t": "A manager must consult HR before issuing any written warning. Termination requires approval from both HR and the department head.", "l": 2}, {"d": "Payroll, Benefits and Exit Policy", "h": "Salary Payment", "t": "Salary is credited on the last working day of every month. Payslips are available on the HR portal by the 3rd of the next month.", "l": 1}, {"d": "Payroll, Benefits and Exit Policy", "h": "Provident Fund", "t": "Both employee and employer contribute 12 percent of basic salary to the Provident Fund (PF).", "l": 1}, {"d": "Payroll, Benefits and Exit Policy", "h": "Health Insurance", "t": "Every employee gets group health insurance coverage of ₹5 lakh per year, which also covers spouse and up to 2 children. Parents can be added at an additional cost paid by the employee.", "l": 1}, {"d": "Payroll, Benefits and Exit Policy", "h": "Reimbursements", "t": "Eligible expenses such as travel and client meetings must be claimed within 30 days of the expense with valid bills. Claims are paid with the next month's salary after manager approval.", "l": 1}, {"d": "Payroll, Benefits and Exit Policy", "h": "Probation and Confirmation", "t": "The probation period is 3 months. Confirmation is based on the manager's performance review. Probation can be extended by up to 3 months.", "l": 1}, {"d": "Payroll, Benefits and Exit Policy", "h": "Performance Reviews and Increments", "t": "Performance reviews are conducted twice a year, in April and October. Salary increments are applied from April based on the annual rating.", "l": 1}, {"d": "Payroll, Benefits and Exit Policy", "h": "Resignation and Notice Period", "t": "The notice period is 60 days for confirmed employees and 30 days for employees on probation. Employees can request a buyout of the notice period with HR and management approval. Final settlement is completed within 45 days of the last working day. Experience letter and relieving letter are issued after clearance of all dues and company assets.", "l": 1}, {"d": "Salary Bands (Confidential - HR only)", "h": "Salary Bands", "t": "Level L1 pays ₹4 to 7 lakh per annum. Level L2 pays ₹7 to 12 lakh per annum. Level L3 pays ₹12 to 20 lakh per annum. Level L4 pays ₹20 to 35 lakh per annum.", "l": 3}, {"d": "Salary Bands (Confidential - HR only)", "h": "Variable Pay", "t": "Variable pay is 10 percent of fixed pay for levels L1 and L2, and 15 percent of fixed pay for levels L3 and L4.", "l": 3}, {"d": "Salary Bands (Confidential - HR only)", "h": "Increment Guidelines", "t": "A rating of 5 earns an increment of 12 to 15 percent. A rating of 4 earns 8 to 10 percent. A rating of 3 earns 5 to 7 percent. A rating of 2 or below earns no increment.", "l": 3}, {"d": "Work From Home (Hybrid) Policy", "h": "Hybrid Model", "t": "Nexora follows a hybrid work model. Employees work 3 days from the office and 2 days from home each week. Office days are Monday, Tuesday and Thursday by default. Teams may agree on different office days with manager approval.", "l": 1}, {"d": "Work From Home (Hybrid) Policy", "h": "Eligibility", "t": "Employees who have completed their 3-month probation are eligible for the hybrid model. Employees on probation must work from the office 5 days a week unless the manager approves otherwise.", "l": 1}, {"d": "Work From Home (Hybrid) Policy", "h": "Core Hours", "t": "Irrespective of location, all employees must be available between 11:00 AM and 4:00 PM on working days for meetings and collaboration.", "l": 1}, {"d": "Work From Home (Hybrid) Policy", "h": "Extra WFH Requests", "t": "Additional WFH days beyond the standard 2 days per week need written approval from the reporting manager. A maximum of 10 extra WFH days per year can be approved. Full remote work for more than 2 weeks continuously requires HR approval.", "l": 1}, {"d": "Work From Home (Hybrid) Policy", "h": "Internet and Equipment Allowance", "t": "Employees get a monthly internet allowance of ₹1,000 for WFH days. The company provides a laptop; employees are responsible for keeping company equipment safe. A VPN must be used when accessing company systems from home.", "l": 1}, {"d": "Work From Home (Hybrid) Policy", "h": "Data Security at Home", "t": "Company data must not be stored on personal devices. Screens must be locked when away. Confidential calls should not be taken in public places.", "l": 1}],PDFS=[{"name": "Complete HR Handbook", "file": "Nexora_HR_Handbook.pdf", "desc": "All policies · 6 pages", "b64": "JVBERi0xLjQKJZOMi54gUmVwb3J0TGFiIEdlbmVyYXRlZCBQREYgZG9jdW1lbnQgKG9wZW5zb3VyY2UpCjEgMCBvYmoKPDwKL0YxIDIgMCBSIC9GMiAzIDAgUgo+PgplbmRvYmoKMiAwIG9iago8PAovQmFzZUZvbnQgL0hlbHZldGljYSAvRW5jb2RpbmcgL1dpbkFuc2lFbmNvZGluZyAvTmFtZSAvRjEgL1N1YnR5cGUgL1R5cGUxIC9UeXBlIC9Gb250Cj4+CmVuZG9iagozIDAgb2J
